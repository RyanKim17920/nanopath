project:
  name: smoke-dinov2
  family: nanopath
  recipe_id: dinov2-vits14-reg-kde
  output_dir: /data/$USER/nanopath/main/smoke
  wandb_dir: /data/$USER/nanopath/wandb

data:
  # dataset_dir holds the parquet shards (shard-NNNNN.parquet) that train.py reads.
  # `prepare.py … download=True` populates it from the medarc/nanopath HF mirror.
  dataset_dir: /data/nanopath_parquet
  split_seed: 42
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.2, 1.0]
  local_crop_scale: [0.03, 0.25]
  color_jitter: 0.45
  color_jitter_saturation: 0.4
  hed_jitter: 0.12
  tissue_thresh: 0.5 # training rejects tiles unless this fraction of pixels has RGB saturation > 0.07

model:
  type: dinov2_vits14_reg

train:
  seed: 1337
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # full-run sample cap; smoke normally reaches max_train_flops first
  max_train_flops: 5000000000000000 # 5.0e15 — short enough to finish in a few minutes
  log_every: 5
  # Smoke leaves no persistent checkpoints; final probes still use a temporary checkpoint.
  save_every: null
  eval_every: 50
  val_batches: 4
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 98
  # Multi-scale local crops (disabled = scalar local_size). e.g. local_size_mix: [[112, 4], [128, 4]] (>= 8 crops).
  local_size_mix: null
  resume: null # optional explicit checkpoint path; null means always start fresh and wipe output_dir

# PCGrad gradient surgery over per-component SSL losses (disabled by default = byte-identical baseline).
pcgrad:
  enabled: false
  mode: cosine_veto
  conflict_threshold: -0.1
  main_loss_idx: 0
  ramp_fraction: 0.2

# SDHL (multi-depth JEPA / Self-Distillation of Hidden Layers): regress the student's masked patch latents at
# intermediate blocks onto the EMA-teacher's latents at the SAME blocks (stop-grad target), a deep-supervision
# auxiliary term = concat-merged smooth_l1 over depths with JEPA's mask weighting. Disabled by default =
# byte-identical baseline (no block capture, no extra loss). Flip enabled:true to activate.
sdhl:
  enabled: false
  target_blocks: [8, 9, 10, 11]
  merge: concat
  loss_weight: 0.2
  per_depth_layernorm: true

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  adam_beta2: 0.99
  warmup_fraction: 0.03
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.002
  kde_concentration: 10.0

probe:
  enabled: true
  model_weights: ema
  count: 1
  datasets:
    - bracs
    - break_his
    - mhist
    - pcam
  segmentation_datasets:
    - pannuke
    - monusac
    - consep
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bracs: /data/eva-data/bracs
    break_his: /data/eva-data/breakhis
    consep: /data/eva-data/consep
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    mhist: /data/eva-data/mhist
    monusac: /data/eva-data/monusac
    pcam: /data/eva-data/patch_camelyon
    pannuke: /data/thunder-data/pannuke
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
